services:
  - type: web
    name: suivi-stock-basique-render
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node render-server.js
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: COMMAND_EMAIL_FROM
        sync: false
      - key: COMMAND_EMAIL_TO
        sync: false
